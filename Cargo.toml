[package]
name = "fnbr-elf-zk-loader"
version = "0.1.0"
edition = "2021"
description = "Cargador ELF que verifica la sección .fnbr.sig antes de conceder PROT_EXEC (FNBR #9)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "fnbr_elf_loader"
path = "src/lib.rs"

[[bin]]
name = "fnbr-sign"
path = "src/bin/fnbr-sign.rs"

[[bin]]
name = "fnbr-load"
path = "src/bin/fnbr-load.rs"

[[bin]]
name = "fnbr-supervise"
path = "src/bin/fnbr-supervise.rs"

[dependencies]
anyhow = "1"
ed25519-dalek = "2"
goblin = { version = "0.8", default-features = false, features = ["std", "elf32", "elf64", "endian_fd"] }
libc = "0.2"
sha2 = "0.10"
hex = "0.4"
curve25519-dalek = { version = "4", default-features = false, features = ["digest", "rand_core", "alloc"] }
rand = "0.8"
rand_core = "0.6"

# El barrido de 13k bytes adulterados es lento sin optimizar las dependencias criptográficas.
[profile.dev.package."*"]
opt-level = 3
[profile.test]
opt-level = 1
